[tools]
python  = "latest"
bun     = "latest"
lua     = "5.4.4"
npm     = "latest"
yarn    = "latest"
go      = "1.27.3"
node    = "24.4"
rust    = "latest"
pnpm    = "12.15.0"

[settings]
# Legacy version file reading (e.g. .nvmrc, .python-version) is enabled by default.
# Disable it per-tool with legacy_version_file_disable_tools if needed.
legacy_version_file = true

[env]


# This was a quick fix for corepack false positives.
# I'm not using corepack any more. Uncomment if needed in feature
# yarn   = "1.22.0" # pin it till the issue is resolved https://github.com/yarnpkg/yarn/issues/9015

# [env]
# _.python.venv = ".venv" # relative to this file's directory
# _.python.venv = "venv" # relative to this file's directory

