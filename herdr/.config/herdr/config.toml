# vim: foldmarker={{{,}}} foldmethod=marker

##########################
# Settings {{{

onboarding = false
[ui]
# Auto-copy any text the mouse selects (drag or double-click).
copy_on_select = true
# status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
window_title = "herdr: {tab} · {workspace}"
# 50% bigger than the default 26-col sidebar, with max width doubled from 36 to 72.
sidebar_width = 44
sidebar_max_width = 128

status_indicators = "symbols"
[ui.toast]
delivery = "system"

[ui.sidebar.agents]
rows = [
  [{ token = "workspace", bold = false }, "tab"],
  [
    "state_icon",
    { token = "$spin", fg = "#fab387", dim = false, bold = true },
    { token = "state_text", bold = false, dim = false },
    "agent",
  ],
]

[theme]
name = "gruvbox"
auto_switch = false
# }}}

##########################
# native KEYBINDINGS {{{
# ported from ~/.dot/tmux/.config/tmux/tmux.conf

[keys]
# Alt+hjkl pane focus (tmux.conf M-h/j/k/l).
# always move herdr pane focus, even inside nvim splits.
# down/up moved off prefix+j/k below (freed for space/agent nav); they're
# already reachable via alt+j/k through herdr-navigator.nvim.
# focus_pane_left  = ["prefix+h"]
# focus_pane_right = ["prefix+l"]

# prefix+j/k next/prev space (workspace), prefix+shift+j/k next/prev agent.
next_agent         = [ "alt+ctrl+j"]
previous_agent     = [ "alt+ctrl+k"]
next_workspace     = [ "alt+down"]
previous_workspace = [ "alt+up"]

swap_pane_left  = ["alt+n"]
swap_pane_down  = ["alt+m"]
swap_pane_up    = ["alt+,"]
swap_pane_right = ["alt+."]

# Alt+Left/Right tab switch, Alt+Shift+Left/Right move tab position
previous_tab      = ["prefix+p", "alt+left"]
next_tab          = ["prefix+n", "alt+right"]
move_tab_previous = "alt+shift+left"
move_tab_next     = "alt+shift+right"

# Resize mode vim keys (tmux.conf M-y/u/i/o resized instantly; herdr only
# resizes inside resize mode, entered with the default prefix+r).
# Flow: prefix+r, then h/j/k/l repeatedly, Escape to exit.
resize_pane_left  = ["alt+y"]
resize_pane_down  = ["alt+u"]
resize_pane_up    = ["alt+i"]
resize_pane_right = ["alt+o"]

# Toggle workspace sidebar collapse (same as herdr's default binding, made explicit).
toggle_sidebar = ["prefix+b"]

# mode here, so this lives on prefix+shift+r instead.
[[keys.command]]
key = "prefix+shift+r"
type = "shell"
command = "herdr server reload-config"
description = "Reload herdr config.toml"
# }}}


##########################
# herdr-navigator.nvim {{{

# hybrid navigation between nvim windows and herd panes

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "willfish.herdr-navigator.left"
description = "navigate left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "willfish.herdr-navigator.down"
description = "navigate down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "willfish.herdr-navigator.up"
description = "navigate up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "willfish.herdr-navigator.right"
description = "navigate right"
#}}}

################
# herdr-nvim {{{

# Neovim, built into herdr workspace

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"
#}}}

##############################
# open agent file in own nvim {{{

# Unlike herdr-nvim's picker (above), this targets the nvim pane you already
# have open on the side instead of spawning/managing its own sidebar nvim,
# and it jumps to the line number, not just the file.
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "bash ~/bin/herdr-open-agent-file.sh"
description = "open agent file:line in nvim pane"
width = "50%"
height = "50%"
#}}}


#####################
# herdr-reviewer {{{ https://github.com/persiyanov/herdr-reviewr
[[keys.command]]
key = "prefix+ctrl+g"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
#}}}


#####################
# herdr-sesh {{{ https://github.com/fullerzz/herdr-plugin-sesh
[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
#}}}



#####################
# herdr-harpoon {{{ https://github.com/hadeson/herdr-harpoon
#
# Tabs must move off the bare digits first. In your existing [keys]
# table (do not add a second one - TOML forbids it) set:
#     switch_tab = "prefix+alt+1..9"
# or, for a direct ctrl+1..9 instead:
#     [keys.indexed]
#     tabs = "ctrl"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "hadeson.herdr-harpoon.add"
description = "harpoon: mark pane"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "hadeson.herdr-harpoon.open-menu"
description = "harpoon: picker"

[[keys.command]]
key = "prefix+j"
type = "plugin_action"
command = "hadeson.herdr-harpoon.jump-1"
description = "harpoon 1"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "hadeson.herdr-harpoon.jump-2"
description = "harpoon 2"

[[keys.command]]
key = "prefix+l"
type = "plugin_action"
command = "hadeson.herdr-harpoon.jump-3"
description = "harpoon 3"

[[keys.command]]
key = "prefix+;"
type = "plugin_action"
command = "hadeson.herdr-harpoon.jump-4"
description = "harpoon 4"

[[keys.command]]
key = "prefix+'"
type = "plugin_action"
command = "hadeson.herdr-harpoon.jump-5"
description = "harpoon 5"

[[keys.command]]
key = "prefix+6"
type = "plugin_action"
command = "hadeson.herdr-harpoon.jump-6"
description = "harpoon 6"

[[keys.command]]
key = "prefix+7"
type = "plugin_action"
command = "hadeson.herdr-harpoon.jump-7"
description = "harpoon 7"

[[keys.command]]
key = "prefix+8"
type = "plugin_action"
command = "hadeson.herdr-harpoon.jump-8"
description = "harpoon 8"

[[keys.command]]
key = "prefix+9"
type = "plugin_action"
command = "hadeson.herdr-harpoon.jump-9"
description = "harpoon 9"
#}}}
