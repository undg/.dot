onboarding = false
[ui]
status_indicators = "dots"
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
window_title = "herdr: {tab} · {workspace}"
# 50% bigger than the default 26-col sidebar, with max width doubled from 36 to 72.
sidebar_width = 44 
sidebar_max_width = 128 

[ui.toast]
delivery = "system"

[theme]
name = "gruvbox"
auto_switch = false

# KEYBINDINGS
# ported from ~/.dot/tmux/.config/tmux/tmux.conf
#############

[keys]
# Alt+hjkl pane focus (tmux.conf M-h/j/k/l).
# always move herdr pane focus, even inside nvim splits.
focus_pane_left  = ["prefix+h"]
focus_pane_down  = ["prefix+j"]
focus_pane_up    = ["prefix+k"]
focus_pane_right = ["prefix+l"]

# Alt+n/m/,/. i3-style pane move (tmux.conf M-n/m/,/.)
swap_pane_left  = ["prefix+shift+h", "alt+n"]
swap_pane_down  = ["prefix+shift+j", "alt+m"]
swap_pane_up    = ["prefix+shift+k", "alt+,"]
swap_pane_right = ["prefix+shift+l", "alt+."]

# Alt+Left/Right tab switch, Alt+Shift+Left/Right move tab position
# (tmux.conf M-Left/Right, M-S-Left/Right)
previous_tab      = ["prefix+p", "alt+left"]
next_tab          = ["prefix+n", "alt+right"]
move_tab_previous = "alt+shift+left"
move_tab_next     = "alt+shift+right"

# Resize mode vim keys (tmux.conf M-y/u/i/o resized instantly; herdr only
# resizes inside resize mode, entered with the default prefix+r).
# Flow: prefix+r, then h/j/k/l repeatedly, Escape to exit.
resize_pane_left  = ["h", "alt+y"]
resize_pane_down  = ["j", "alt+u"]
resize_pane_up    = ["k", "alt+i"]
resize_pane_right = ["l", "alt+o"]

# Toggle workspace sidebar collapse (same as herdr's default binding, made explicit).
toggle_sidebar = ["prefix+b"]

# Reload config (tmux.conf `bind r` source-file). prefix+r is already resize
# mode here, so this lives on prefix+shift+r instead.
[[keys.command]]
key = "prefix+shift+r"
type = "shell"
command = "herdr server reload-config"
description = "Reload herdr config.toml"


##########################
# herdr-navigator.nvim {{{

# hybrid navigation between nvim windows and herd panes

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "willfish.herdr-navigator.left"
description = "navigate left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "willfish.herdr-navigator.down"
description = "navigate down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "willfish.herdr-navigator.up"
description = "navigate up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "willfish.herdr-navigator.right"
description = "navigate right"
#}}}

################
# herdr-nvim {{{

# Neovim, built into herdr workspace

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"
#}}}


#####################
# herdr-worktrunk {{{

# Override herdr's built-in "new worktree" key (prefix+shift+g) with worktrunk's
# default-branch switch/create picker:
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "Worktree: switch / create from default branch"

# Optional: bind current-branch creation separately.
[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "Worktree: switch / create from current branch"

# Optional: include remote-tracking branches for this picker.
[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "worktrunk.open-with-remotes"
description = "Worktree: switch / create from local or remote branches"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "Worktree: remove"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "worktrunk.merge"
description = "Worktree: merge into the target branch"
#}}}
