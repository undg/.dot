[ui]
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
window_title = "herdr: {tab} · {workspace}"

[ui.toast]
delivery = "system"

[theme]
name = "gruvbox"
auto_switch = false

# KEYBINDINGS
# ported from ~/.dot/tmux/.config/tmux/tmux.conf
#############

[keys]
# Alt+hjkl pane focus (tmux.conf M-h/j/k/l).
# NOTE: unlike tmux's is_vim check, herdr has no vim-aware passthrough — these
# always move herdr pane focus, even inside nvim splits.
focus_pane_left  = ["prefix+h", "alt+h"]
focus_pane_down  = ["prefix+j", "alt+j"]
focus_pane_up    = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]

# Alt+n/m/,/. i3-style pane move (tmux.conf M-n/m/,/.)
swap_pane_left  = ["prefix+shift+h", "alt+n"]
swap_pane_down  = ["prefix+shift+j", "alt+m"]
swap_pane_up    = ["prefix+shift+k", "alt+,"]
swap_pane_right = ["prefix+shift+l", "alt+."]

# Alt+Left/Right tab switch, Alt+Shift+Left/Right move tab position
# (tmux.conf M-Left/Right, M-S-Left/Right)
previous_tab      = ["prefix+p", "alt+left"]
next_tab          = ["prefix+n", "alt+right"]
move_tab_previous = "alt+shift+left"
move_tab_next     = "alt+shift+right"

# Resize mode vim keys (tmux.conf M-y/u/i/o resized instantly; herdr only
# resizes inside resize mode, entered with the default prefix+r).
# Flow: prefix+r, then h/j/k/l repeatedly, Escape to exit.
resize_pane_left  = "h"
resize_pane_down  = "j"
resize_pane_up    = "k"
resize_pane_right = "l"

# Sessionizer popup (tmux.conf C-g root + prefix+C-g -> tmux-sessionizer)
[[keys.command]]
key = "ctrl+g"
type = "pane"
command = "~/bin/tmux-sessionizer"
description = "Fuzzy project/session switcher"

[[keys.command]]
key = "prefix+ctrl+g"
type = "pane"
command = "~/bin/tmux-sessionizer"
description = "Fuzzy project/session switcher"

# Sesh popup (tmux.conf prefix+C-b -> display-popup sesh/tv)
[[keys.command]]
key = "prefix+ctrl+b"
type = "popup"
command = "command -v tv >/dev/null 2>&1 && tv sesh || sesh connect $(sesh list | fzf)"
description = "Sesh session picker"
width = "80%"
height = "70%"

# Reload config (tmux.conf `bind r` source-file). prefix+r is already resize
# mode here, so this lives on prefix+shift+r instead.
[[keys.command]]
key = "prefix+shift+r"
type = "shell"
command = "herdr server reload-config"
description = "Reload herdr config.toml"
